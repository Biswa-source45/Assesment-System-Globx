# Database migrations. The connection comes from the app settings (DATABASE_URL), see migrations/env.py.
#   alembic revision --autogenerate -m "what changed"   write a new migration after editing app/models.py
#   alembic upgrade head                                 apply migrations (the app also does this on start)
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
