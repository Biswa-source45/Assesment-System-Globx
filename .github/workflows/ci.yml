# Every push and pull request: the backend tests and the judge's attack drill must pass.
# A push to main that passes both builds the three images and publishes them to GitHub's image store (ghcr.io), where the office server pulls them.
name: tests and images

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d oap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oap_test
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend

  judge-drill:
    runs-on: ubuntu-latest
    env:  # docker-compose.yml wants these set, even to run only the judge
      DB_PASSWORD: ci-only
      SECRET_KEY: ci-only
      DOMAIN: ci.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build judge
      - name: Attack drill, must end with "39 of 39 checks passed"
        run: docker compose run --rm --no-deps judge python -m app.sandbox.hostile

  publish:
    needs: [tests, judge-drill]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, file: Dockerfile.api }
          - { name: judge, file: Dockerfile.judge }
          - { name: caddy, file: Dockerfile.caddy }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names must be lower case
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/oap-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/oap-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
